<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كريم أبو الصحاب - جميع الروابط</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html, body {
      min-height: 100vh;
      width: 100%;
    }

    body {
      background-color: #05070a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 30px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* خلفية البلور والزخرفة الملونة من الصورة */
    .bg-overlay {
      position: fixed;
      top: -5%;
      left: -5%;
      width: 110%;
      height: 110%;
      background-image: url('4a44b1a3-ddc5-4835-bb3f-ecf267a348d8.jpeg');
      background-size: cover;
      background-position: center;
      filter: blur(18px) brightness(0.38) contrast(1.15);
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 410px;
      text-align: center;
      z-index: 2;
    }

    /* قسم البروفايل مع الهالة الذهبية المشعة */
    .profile-section {
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile-avatar-container {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 3.5px solid #dfb743;
      /* التوهج والنيون الذهبي حول الدائرة */
      box-shadow: 0 0 25px #d4af37, 0 0 50px rgba(212, 175, 55, 0.4), inset 0 0 15px rgba(0,0,0,0.5);
      margin-bottom: 18px;
      overflow: hidden;
      background-color: #111622;
      transition: all 0.3s ease;
    }

    .profile-avatar-container:hover {
      transform: scale(1.04);
      box-shadow: 0 0 35px #f1c40f, 0 0 60px rgba(241, 196, 15, 0.6);
    }

    .profile-avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .header h1 {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 6px;
      color: #f3e5ab; /* لون ذهبي فاتح وفخم */
      text-shadow: 0 0 12px rgba(212, 175, 55, 0.6), 0 2px 8px rgba(0,0,0,0.9);
      letter-spacing: 0.5px;
    }

    .header p {
      font-size: 14px;
      color: #e2e8f0;
      margin-bottom: 12px;
      text-shadow: 0 1px 5px rgba(0,0,0,0.9);
    }

    /* الزخرفة الذهبية الفاخرة تحت النص */
    .divider-ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
      color: #d4af37;
      font-size: 18px;
      opacity: 0.9;
    }

    .divider-ornament::before,
    .divider-ornament::after {
      content: "";
      height: 1px;
      width: 60px;
      background: linear-gradient(90deg, transparent, #d4af37, transparent);
      margin: 0 12px;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(14, 19, 30, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.3); /* إطار فرعي بلون ذهبي هادئ */
      border-radius: 16px;
      padding: 16px 20px;
      text-decoration: none;
      color: #ffffff;
