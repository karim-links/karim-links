<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كريم أبو الصحاب - جميع الروابط</title>
  <!-- استدعاء أيقونات Font Awesome للحصول على أيقونات التواصل -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* إعادة تعيين وتحضير الخصائص العامة */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #080b11;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 30px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* الخلفية المضبة (Blurred Background) */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('profile.jpg'); /* تأكد من تسمية الصورة بـ profile.jpg في نفس المجلد */
      background-size: cover;
      background-position: center;
      filter: blur(25px) brightness(0.25);
      transform: scale(1.1);
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
      z-index: 1;
    }

    /* قسم البروفايل والصورة الشخصية */
    .profile-section {
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #d4af37; /* إطار ذهبي أنيق */
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.25), 0 0 15px rgba(0, 0, 0, 0.8);
      margin-bottom: 15px;
      transition: transform 0.3s ease;
    }

    .profile-avatar:hover {
      transform: scale(1.05);
    }

    /* العنوان الرئيسي والفرعي */
    .header h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .header p {
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    /* قائمة الأزرار/الروابط */
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* تصميم البطاقة الواحدة */
    .card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(22, 28, 40, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px 20px;
      text-decoration: none;
      color: #ffffff;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .card:hover {
      background: rgba(30, 38, 56, 0.9);
      border-color: rgba(212, 175, 55, 0.5);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }

    /* الجزء الأيمن (الأيقونة والنصوص) */
    .card-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .card-info {
      text-align: right;
    }

    .card-title {
      font-size: 17px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 3px;
    }

    .card-subtitle {
      font-size: 12px;
      color: #94a3b8;
    }

    /* تصميم مربعات الأيقونات */
    .icon-box {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    /* ألوان الأيقونات لكل منصة */
    .whatsapp-bg { background-color: #25d366; }
    .tiktok-bg { background: linear-gradient(45deg, #00f2fe, #4facfe, #ff0844); }
    .facebook-bg { background-color: #1877f2; }
    .instagram-bg { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .telegram-bg { background-color: #24a1de; }
    .location-bg { background-color: #22c55e; }

    /* السهم جهة اليسار */
    .arrow-icon {
      font-size: 16px;
      color: #64748b;
      transition: color 0.3s ease;
    }

    .card:hover .arrow-icon {
      color: #ffffff;
    }

    /* التذييل (Footer) */
    .footer {
      margin-top: 35px;
      text-align: center;
    }

    .footer-tag {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .footer-badge {
      display: inline-block;
      background: rgba(22, 28, 40, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 12px;
      text-decoration: none;
    }
  </style>
</head>
<body>

      <!-- 6. الموقع الجغرافي -->

    </div>

    <!-- الفوتر -->
    <div class="footer">
      <div class="footer-tag">◆ التمني والمراعاة والمودة ◆</div>
      <span class="footer-badge">karim-links.github.io</span>
    </div>

  </div>

</body>
</html>
