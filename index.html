<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كريم أبو الصحاب - جميع الروابط</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html, body {
      min-height: 100vh;
      width: 100%;
    }

    body {
      background-color: #05070a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 30px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* خلفية البلور الممتدة باستخدام اسم الصورة المرفوعة */
    .bg-overlay {
      position: fixed;
      top: -10%;
      left: -10%;
      width: 120%;
      height: 120%;
      background-image: url('4a44b1a3-ddc5-4835-bb3f-ecf267a348d8.jpeg');
      background-size: cover;
      background-position: center;
      filter: blur(35px) brightness(0.22) contrast(1.1);
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 410px;
      text-align: center;
      z-index: 2;
    }

    .profile-section {
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile-avatar-container {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      border: 3px solid #d4af37;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.35), 0 8px 20px rgba(0, 0, 0, 0.9);
      margin-bottom: 15px;
      overflow: hidden;
      background-color: #111622;
    }

    .profile-avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    .header p {
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 25px;
      text-shadow: 0 1px 5px rgba(0,0,0,0.8);
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(18, 24, 38, 0.82);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 16px 20px;
      text-decoration: none;
      color: #ffffff;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .card:hover {
      background: rgba(28, 36, 56, 0.92);
      border-color: rgba(212, 175, 55, 0.6);
      transform: translateY(-2px);
    }

    .card-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .card-info {
      text-align: right;
    }

    .card-title {
      font-size: 17px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 3px;
    }

    .card-subtitle {
      font-size: 12px;
      color: #94a3b8;
    }

    .icon-box {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .whatsapp-bg { background-color: #25d366; }
    .tiktok-bg { background: linear-gradient(45deg, #00f2fe, #4facfe, #ff0844); }
    .facebook-bg { background-color: #1877f2; }
    .instagram-bg { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .telegram-bg { background-color: #24a1de; }
    .location-bg { background-color: #22c55e; }

    .arrow-icon {
      font-size: 16px;
      color: #64748b;
    }

    .card:hover .arrow-icon {
      color: #ffffff;
    }

    .footer {
      margin-top: 35px;
      text-align: center;
    }

    .footer-tag {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .footer-badge {
      display: inline-block;
      background: rgba(18, 24, 38, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 12px;
      text-decoration: none;
    }
  </style>
</head>

    </div>

    <div class="footer">
